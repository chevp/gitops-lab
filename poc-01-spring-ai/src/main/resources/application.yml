spring:
  application:
    name: poc-01-chat
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
  datasource:
    url: jdbc:h2:mem:chat;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

# Application-specific chat settings
app:
  chat:
    # Hard cap on generated tokens per request (maxTokens on the LLM call)
    max-tokens: 100
    # Cap on the prompt tokens sent to the LLM per request (input is trimmed)
    max-input-tokens: 100
    # Rolling daily budget across all requests (input + output); resets at midnight
    max-tokens-per-day: 1000

server:
  port: 8080
