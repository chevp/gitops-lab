{{- if not .Values.openai.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.openaiSecretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.openai.secretKey }}: {{ required "openai.apiKey (oder openai.existingSecret) muss gesetzt sein" .Values.openai.apiKey | quote }}
{{- end }}
